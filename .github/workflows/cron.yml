name: Scheduled maintenance cron

# Hits the app's two cron-only endpoints on a schedule, since this
# deployment (EasyPanel) has no built-in scheduler of its own:
#
#   /api/flows/cron        - marks abandoned flow runs "timed_out"
#                             after their fallback_policy.on_timeout_hours
#                             (24h default). Without this, a customer who
#                             leaves a conversation mid-flow (or never
#                             replies past the greeting) keeps a
#                             permanently "active" run, which blocks any
#                             new keyword-triggered flow for them forever
#                             (idx_one_active_run_per_contact) — "hola"
#                             would silently do nothing if they came back
#                             weeks later.
#
#   /api/automations/cron  - drains due automation_pending_executions
#                             rows (delayed automation steps, e.g. "wait
#                             2h then send a message"). Without this,
#                             any automation with a delay step never
#                             actually fires past that step.
#
#   /api/whatsapp/catalog/cron-sync - refreshes every account's Meta
#                             product catalog (name/price/availability/
#                             image). Runs on the separate daily
#                             schedule below, not the 15-minute one —
#                             product data doesn't churn fast enough to
#                             justify that cadence, and each leg can be
#                             a non-trivial number of Meta API calls for
#                             a large catalog (see the route's own
#                             comment).
#
#   /api/flows/birthday-cron - starts an account's configured birthday
#                             flow for any contact whose "Fecha de
#                             nacimiento" custom field matches today.
#                             Daily-only, same reasoning as the catalog
#                             sync: a birthday only needs checking once
#                             a day, not every 15 minutes.
#
# All three endpoints require the same X-Cron-Secret header (by design,
# see their route.ts comments) — set as the CRON_SECRET repo secret
# below, matching AUTOMATION_CRON_SECRET on the actual deployment.
on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "0 8 * * *"
  workflow_dispatch: {}

jobs:
  ping-cron-endpoints:
    runs-on: ubuntu-latest
    steps:
      - name: Sweep stale flow runs
        run: |
          curl -sf -o /dev/null -w "flows/cron -> %{http_code}\n" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.WACRM_BASE_URL }}/api/flows/cron"

      - name: Drain due automation steps
        run: |
          curl -sf -o /dev/null -w "automations/cron -> %{http_code}\n" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.WACRM_BASE_URL }}/api/automations/cron"

      - name: Sync WhatsApp product catalogs (daily only)
        if: github.event.schedule == '0 8 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          curl -sf -o /dev/null -w "catalog/cron-sync -> %{http_code}\n" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.WACRM_BASE_URL }}/api/whatsapp/catalog/cron-sync"

      - name: Send birthday messages (daily only)
        if: github.event.schedule == '0 8 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          curl -sf -o /dev/null -w "flows/birthday-cron -> %{http_code}\n" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.WACRM_BASE_URL }}/api/flows/birthday-cron"
